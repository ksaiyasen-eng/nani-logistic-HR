<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://sfwsedtxdlummiqblufq.supabase.co https://script.google.com https://script.googleusercontent.com; img-src 'self' data: blob: https://sfwsedtxdlummiqblufq.supabase.co; frame-src https://sfwsedtxdlummiqblufq.supabase.co; base-uri 'none'; form-action 'none'">
<title>Nany Logistic HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1B2333;--mut:#667085;--line:#E3E8EF;--line2:#EEF1F6;--bg:#EEF2F8;--card:#fff;--pri:#2563EB;--pri-h:#1D4ED8;--pri2:#E8EFFE;--acc:#D9483B;--acc2:#FDECEA;--warn:#9A6B00;--warn2:#FBF1D6;--ok:#2F7A3E;--ok2:#E2F1E4;--hero:#1F2430;--r:20px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans Lao",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--pri)}a:hover{color:var(--pri-h)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600}
button:hover{background:#F6F8FB}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button.pri:hover{background:var(--pri-h)}
button.dng{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
input,select,textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%}
textarea{min-height:80px}
.dsel{display:flex;gap:6px;min-width:0}.dsel select{width:auto;flex:1 1 0;min-width:64px;padding:8px}.dsel.bad select{border-color:var(--acc)}
.fsel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.cell{min-height:34px;padding:4px 8px;border-radius:6px;text-align:right;width:80px;font-variant-numeric:tabular-nums}
.emp{position:sticky;left:0;z-index:2;background:#fff;min-width:200px;max-width:260px;white-space:normal;box-shadow:1px 0 0 var(--line)}
th.emp{z-index:3;background:#FBFAF7}
.emp .nm{font-weight:600;line-height:1.45}.emp .cd{font-size:12px;color:var(--mut);white-space:nowrap;margin-top:2px;font-variant-numeric:tabular-nums}
label{display:grid;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--card);border:0;border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.3}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.tw{overflow-x:auto;border:0;border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
.card .tw,.dlg .tw{box-shadow:none;border:1px solid var(--line2);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:10px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line2);color:var(--mut);white-space:nowrap}
.org{overflow-x:auto;padding:4px 0 8px}
.org ul{display:flex;justify-content:center;padding:22px 0 0;margin:0;position:relative}
.org>ul{padding-top:0;min-width:max-content}
.org li{list-style:none;position:relative;padding:22px 5px 0;display:flex;flex-direction:column;align-items:center}
.org>ul>li{padding-top:0}
.org li::before,.org li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:2px solid var(--line)}
.org li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:first-child::before,.org li:last-child::after{border:0}
.org li:last-child::before{border-right:2px solid var(--line);border-radius:0 8px 0 0}
.org li:first-child::after{border-radius:8px 0 0 0}
.org>ul>li::before,.org>ul>li::after{display:none}
.org ul ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:2px solid var(--line)}
.org li:only-child{padding-top:22px}
.oc{display:grid;gap:8px;justify-items:center;width:150px;min-height:0;height:auto;padding:12px 10px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:center;font-weight:400}
.oc b{font-size:13px;line-height:1.35}
.oc.top{background:var(--pri2);border-color:var(--pri)}
.oc.empty{border-style:dashed}
.oc-ppl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.oc-ppl>span{display:grid;justify-items:center;gap:2px;width:48px}
.oc-ppl small{font-size:11px;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.oc-n{font-size:11px;color:var(--mut)}
.tl-r{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tl-s{border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;color:var(--mut);text-align:center;line-height:1.3;font-variant-numeric:tabular-nums}
.tl-s b{display:block;font-size:14px;color:var(--ink)}.tl-s.on{border-color:var(--warn);background:var(--warn2)}.tl-s.on b{color:var(--warn)}
.tl-n{color:var(--warn);background:var(--warn2);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;margin-top:6px}
.p-ok{background:var(--ok2);color:var(--ok)}.p-warn{background:var(--warn2);color:var(--warn)}.p-bad{background:var(--acc2);color:var(--acc)}.p-pri{background:var(--pri2);color:var(--pri)}
.top{background:transparent;color:var(--ink)}
.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:16px;padding-bottom:8px}
.top select,.top input{width:auto;min-height:40px;background:var(--card);color:var(--ink);box-shadow:var(--sh);border-color:transparent}
.top .hi{font-size:clamp(18px,4.8vw,22px);font-weight:700}
@media (max-width:600px){.top .net{font-size:0;gap:0}}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 16px;max-width:1240px;margin:0 auto;scrollbar-width:none}
.tabs button{border:0;border-radius:12px;background:transparent;color:var(--mut);white-space:nowrap;min-height:42px;font-weight:500}
.tabs button:hover{background:var(--line2);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--pri2);color:var(--pri);font-weight:600}
/* HR shell: sidebar on wide screens, scrollable tab strip on phones */
.side{background:var(--card);box-shadow:var(--sh);position:sticky;top:0;z-index:20}
.side .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:14px 16px 6px}
.side .brand i{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.side .tabs{padding-bottom:10px}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .side{height:100vh;display:flex;flex-direction:column;box-shadow:none;border-right:1px solid var(--line2)}
  .side .brand{padding:24px 22px 18px}
  .side .tabs{flex-direction:column;overflow:auto;padding:0 14px 20px;margin:0;flex:1}
  .side .tabs button{text-align:left;padding:0 14px}
}
.kpi{display:grid;gap:6px}.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpis>.kpi:first-child{background:var(--hero);color:#fff}.kpis>.kpi:first-child .mut{color:#C9CED8}
@media (max-width:600px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpis .kpi{padding:14px}.kpis .kpi .v{font-size:19px}}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.net i{width:8px;height:8px;border-radius:50%;background:#7FD3A0;display:inline-block}
.net.busy i{background:#F2B84B}.net.off i{background:#F28B6B}
.punch{width:100%;min-height:140px;border-radius:22px;font-size:28px;border:0;color:#fff;background:#16A34A;display:grid;place-items:center;gap:2px;padding:16px}
.punch .e{font-size:52px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;min-height:110px;display:grid;place-items:center;gap:4px;padding:12px;font-weight:600}
.tile .e{font-size:42px;line-height:1}
.ic{position:relative;display:inline-block;width:52px;height:52px;flex:none}.ic svg{width:52px;height:52px}
.ic i{position:absolute;right:-4px;top:-4px;font-style:normal;font-size:18px;line-height:1}
.ic em{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 4px;line-height:15px;white-space:nowrap;color:var(--ink)}
.qrow{grid-column:1/-1;display:grid;grid-template-columns:60px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line2)}
.qrow .ql{font-size:15px;line-height:1.3;color:var(--ink)}.qrow .ql small{display:block;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;min-height:44px;padding:0;font-size:22px}.step input{width:70px;text-align:center;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.punch.out{background:var(--acc)}
.punch small{font-size:14px;font-weight:500;opacity:.9}
.bar{height:10px;border-radius:5px;background:var(--pri)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,480px)}
#toast div{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#toast div.err{background:var(--acc)}
.dlgbg{position:fixed;inset:0;background:rgba(20,30,32,.45);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:grid;gap:14px}
.dlg.wide{max-width:1000px}
.err-box{background:var(--acc2);color:var(--acc);padding:10px 12px;border-radius:10px;font-size:14px}
.warn-box{background:var(--warn2);color:#6B4A00;padding:10px 12px;border-radius:10px;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{border:1px solid var(--line2);border-radius:8px;padding:4px;min-height:52px;font-size:11px}
#print{display:none}
.doc{font-size:13px;line-height:1.7;color:#000;max-width:780px;margin:0 auto;position:relative}
.doc table td,.doc table th{border:1px solid #999;padding:6px 8px;position:static;background:none;color:#000;font-size:13px}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;color:rgba(180,84,47,.14);transform:rotate(-22deg);pointer-events:none;font-weight:700}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;text-align:center}
.sig div{border-top:1px dotted #000;padding-top:6px;min-height:60px}
@media print{body{background:#fff}#app,#toast,#dlg{display:none!important}#print{display:block}.pb{page-break-after:always}@page{size:A4;margin:14mm}}
@media (pointer:coarse){button.sm{min-height:44px;padding:0 14px}.dsel{display:flex;gap:6px;min-width:0}.dsel select{width:auto;flex:1 1 0;min-width:64px;padding:8px}.dsel.bad select{border-color:var(--acc)}
.fsel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.cell{min-height:44px}}
@media (prefers-color-scheme:dark){
:root{color-scheme:dark;--ink:#E7EBF2;--mut:#98A2B3;--line:#2B3342;--line2:#232A36;--bg:#0F141C;--card:#171D27;--pri:#2563EB;--pri-h:#1D4ED8;--pri2:#1A2740;--acc:#C93F33;--acc2:#3A1F1C;--warn:#E3B04B;--warn2:#3A2E10;--ok:#6FCF82;--ok2:#173321;--hero:#2563EB;--sh:0 1px 2px rgba(0,0,0,.3)}
a,a:hover,.tabs button[aria-selected=true],.p-pri{color:#8AB4FF}
button,input,select,textarea,.emp,.tw,.dlg{background:var(--card)}
button:hover{background:#1F2734}
button.pri{background:var(--pri)}button.dng{background:var(--acc)}
th,th.emp{background:#1C2330}
.p-bad,.err-box{color:#F0A58C}.warn-box{color:#F0CF86}
.top select,.top input{background:var(--card);color:var(--ink)}
.dlgbg{background:rgba(0,0,0,.6)}
}
@media print and (prefers-color-scheme:dark){body,.doc{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function setNet(st) { const n = $("#net"); if (n) { n.className = "net " + st; n.lastChild.textContent = st === "off" ? " ອອບລາຍ" : st === "busy" ? " ກຳລັງໂຫຼດ" : " ເຊື່ອມຕໍ່ແລ້ວ"; } }
// ອ່ານຢ່າງດຽວ = ລອງໃໝ່ໄດ້ 3 ຄັ້ງ; ຂຽນ = ບໍ່ລອງໃໝ່ ແລະ ຄຳຂໍທີ່ຄືກັນທຸກຢ່າງທີ່ກຳລັງສົ່ງຢູ່ (ກົດຊ້ຳ) ໃຊ້ຄຳຂໍດຽວກັນ
const READ_ACTIONS = new Set(["me", "employees", "settingsGet", "holidays", "monthGet", "attendanceBoard", "attendanceFlags", "attendanceMonthAdmin", "myAttendance", "myLeaves", "leavesAdmin", "leaveDoc", "leaveAttachment", "leaveQuote", "approvals", "payslipMonths", "payslip", "welfare", "status", "importProposals", "auditLog", "boot", "entries", "payroll.get", "hr.links", "hr.driverPay", "listDocs", "myProfile", "empProfile", "empPhotos"]);
const inflight = new Map();
function post(url, ct, body, read) {
  const key = url + body;
  if (!read && inflight.has(key)) return inflight.get(key);
  const run = async () => {
    for (let a = 1; ; a++) {
      const ac = new AbortController(), t = setTimeout(() => ac.abort(), 30000);
      try { return await (await fetch(url, { method: "POST", headers: { "content-type": ct }, body, signal: ac.signal })).json(); }
      catch (e) { if (!read || a >= 3) throw e; await new Promise((r) => setTimeout(r, 600 * a)); }
      finally { clearTimeout(t); }
    }
  };
  const p = run();
  if (!read) { inflight.set(key, p); p.finally(() => inflight.delete(key)).catch(() => {}); }
  return p;
}
async function api(action, data = {}) {
  setNet("busy");
  let j;
  try {
    j = await post(API, "application/json", JSON.stringify({ action, token: S.token, ...data }), READ_ACTIONS.has(action));
  } catch { setNet("off"); const e = new Error("ເຊື່ອມຕໍ່ອິນເຕີເນັດບໍ່ໄດ້ — ກວດເນັດແລ້ວລອງໃໝ່"); e.code = "network"; throw e; }
  setNet("ok");
  if (!j.ok) {
    if (j.error === "unauthorized" && S.token && !["empLogin", "hrLogin", "setup"].includes(action)) { logout(ERR.unauthorized); }
    const e = new Error(errMsg(j)); e.code = j.error; e.data = j; throw e;
  }
  return j;
}

  const close = () => { host.innerHTML = ""; };
  $("#dlgC") && ($("#dlgC").onclick = close);
  $(".dlgbg").addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  if ($("#dlgO")) $("#dlgO").onclick = async () => {

  return close;
}

  const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
  for (const q of [0.85, 0.7, 0.55, 0.4]) { const bl = await new Promise((r) => c.toBlob(r, "image/jpeg", q)); if (bl.size <= 1e6) return { name: file.name.replace(/\.\w+$/, "") + ".jpg", mime: "image/jpeg", b64: await b64(bl) }; }
  throw new Error(ERR.attachment_too_large);
}

function parseCSV(t) {

function csvImport(kind) {
  dialog({ title: kind === "emp" ? "ນຳເຂົ້າພະນັກງານ (CSV)" : "ນຳເຂົ້າຂໍ້ມູນເງິນເດືອນລາຍເດືອນ (CSV)", ok: "ກວດສອບກ່ອນ", wide: true, body: `<div class="grid" style="gap:10px">

    <p class="sm">ໄຟລ໌ຈະຖືກສົ່ງຈາກເຄື່ອງນີ້ໄປຫາຖານຂໍ້ມູນໂດຍກົງ (HTTPS). ຢ່າສົ່ງໄຟລ໌ນີ້ໃນແຊັດ ຫຼື GitHub.</p>

function tEntryForm(cur, onDone) {

  const e = cur ? JSON.parse(JSON.stringify(cur)) : { date: T.today || curDate(), veh: T.me.veh || cfg.vehicles[0]?.id, crew: [], rounds: [null, null, null, null], places: ["", "", "", ""], damages: [], note: "" };
  e.places = [0, 1, 2, 3].map((i) => e.places?.[i] || "");
  const drivers = T.staff.filter((s) => s.active && s.role !== "admin");
  const vehCrew = (v) => drivers.filter((s) => s.veh === v).map((s) => s.nick);
  if (!cur) e.crew = admin ? vehCrew(e.veh) : [T.me.nick];
  const erpLock = !admin && cur && cur.source === "erp";
  let touched = false;
  const dates = Array.from({ length: back + 1 }, (_, i) => addD(T.today, -i));
  const canDel = cur && (admin || (cur.status !== "approved" && (cur.crew || []).includes(T.me.nick)));
  dialog({ title: cur ? `${dmy(e.date)} · ${tVehName(e.veh)}` : "ບັນທຶກການສົ່ງ", ok: "ບັນທຶກ", body: `<div class="grid" style="gap:12px">
    ${cur && cur.status === "approved" ? `<div class="warn-box">ລາຍງານນີ້ອະນຸມັດແລ້ວ — ແກ້ແລ້ວຈະປ່ຽນເງິນຂອງທີມ</div>` : ""}
    ${erpLock ? `<div class="warn-box">ຈຳນວນທີ່ມາຈາກ ERP ແກ້ບໍ່ໄດ້ — ຊ່ອງອື່ນ (ທີມ, ແພັກລູກຄ້າຫາເອງ, ສະຖານທີ່, ໝາຍເຫດ) ແກ້ໄດ້</div>` : ""}
    <div class="grid g2">
      <label>ວັນທີ${cur ? `<input value="${esc(dmy(e.date))}" disabled>` : admin ? `<input type="date" id="td" value="${esc(e.date)}">` : `<select id="td">${dates.map((d) => `<option value="${d}">${dmy(d)}${d === T.today ? " (ມື້ນີ້)" : ""}</option>`).join("")}</select>`}</label>
      <label>ລົດ<select id="tv" ${cur ? "disabled" : ""}>${cfg.vehicles.map((v) => `<option value="${esc(v.id)}" ${v.id === e.veh ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></label>
    </div>
    <div class="grid" style="gap:6px"><div class="sm mut" style="font-weight:500">ທີມ — ສູງສຸດ 6 ຄົນ, ແບ່ງເງິນເທົ່າກັນ</div><div id="tcr" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
    <div id="tqf" class="grid" style="gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr))"></div>
    ${admin ? `<div class="grid g2"><label>ປັບເພີ່ມ/ຫັກ (₭)<input id="ta" inputmode="numeric" value="${esc(e.adj ?? "")}"></label><label>ສະຖານະ<select id="ts"><option value="approved">ອະນຸມັດເລີຍ</option><option value="pending" ${cur && cur.status === "pending" ? "selected" : ""}>ລໍຖ້າ</option></select></label></div>` : ""}
    <label>ໝາຍເຫດ<input id="tn" maxlength="200" value="${esc(e.note || "")}"></label>
    <div id="tpv" class="card grid" style="background:var(--line2);box-shadow:none;padding:12px;gap:8px"></div>
    ${canDel ? `<button type="button" class="sm" id="tdel" style="justify-self:start;color:var(--acc)">ລຶບລາຍງານນີ້</button>` : ""}</div>`,
    onOpen: (r) => {
      const nv = (s) => { s = String(s).trim().replace(/,/g, ""); return s === "" ? null : Number(s); };
      const read = () => {
        if (!cur) { e.veh = val(r, "tv"); e.date = val(r, "td"); }
        $$("[data-q]", r).forEach((i) => { e[i.dataset.q] = nv(i.value); });
        $$("[data-rd]", r).forEach((i) => { e.rounds[+i.dataset.rd] = nv(i.value); });
        $$("[data-pl]", r).forEach((i) => { e.places[+i.dataset.pl] = i.value.trim(); });
        e.crew = $$("[data-crew]", r).filter((c) => c.checked).map((c) => c.dataset.crew);
        if (admin) e.adj = nv(val(r, "ta")); e.note = val(r, "tn");
      };
      const preview = () => {
        read(); const c = tCalc(e), w = [];
        if (c.big) e.rounds.forEach((q, i) => { if (num(q) > num(cfg.warnRound)) w.push(`ຮອບ ${i + 1} = ${fmt(q)} ສູງກວ່າປົກກະຕິ`); });
        Object.keys(TQ).forEach((k) => { if (num(e[k]) > num(cfg.warnDaily)) w.push(`${TQ[k]} ${fmt(e[k])} ສູງກວ່າປົກກະຕິ (${fmt(cfg.warnDaily)})`); });
        if (!c.crew.length) w.push("ຍັງບໍ່ໄດ້ເລືອກທີມ — ຈະບໍ່ມີໃຜໄດ້ເງິນ");
        if ([...Object.keys(TQ).map((k) => e[k]), ...e.rounds].some((q) => num(q) > num(cfg.hardCap))) w.push(`ເກີນ ${fmt(cfg.hardCap)} — ກວດຄືນ`);
        $("#tpv", r).innerHTML = `${tLadder(e)}${c.lines.map(([l, v]) => `<div class="row sm" style="justify-content:space-between"><span>${esc(l)}</span><span class="num">${fmt(v)}</span></div>`).join("") || `<div class="sm mut">ໃສ່ຈຳນວນເພື່ອຄິດໄລ່</div>`}
          <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:6px;margin-top:2px"><b>ລວມ</b><b class="num">${fmt(c.total)} ₭</b></div>
          <div class="row sm" style="justify-content:space-between"><span>ຕໍ່ຄົນ (${c.crew.length} ຄົນ)</span><b class="num" style="color:var(--pri)">${fmt(c.per)} ₭</b></div>
          ${w.map((x) => `<div class="warn-box" style="margin-top:4px">${esc(x)}</div>`).join("")}`;
      };
      const drawCrew = () => {
        const sorted = drivers.slice().sort((a, b) => (b.veh === e.veh) - (a.veh === e.veh));
        $("#tcr", r).innerHTML = sorted.map((s) => { const on = e.crew.includes(s.nick), self = !admin && s.nick === T.me.nick;
          return `<label style="display:inline-flex;flex-direction:row;gap:6px;align-items:center;border:1px solid ${on ? "var(--pri)" : "var(--line)"};background:${on ? "var(--pri2)" : "#fff"};border-radius:999px;padding:0 14px;min-height:44px;color:var(--ink);font-size:14px;cursor:pointer"><input type="checkbox" data-crew="${esc(s.nick)}" ${on ? "checked" : ""} ${self ? "disabled" : ""} style="width:auto;min-height:0">${esc(s.nick)}${s.veh && s.veh !== e.veh ? `<span class="xs mut">${esc(s.veh)}</span>` : ""}</label>`; }).join("");
        $$("[data-crew]", r).forEach((c) => c.onchange = () => {
          if ($$("[data-crew]", r).filter((x) => x.checked).length > 6) { c.checked = false; toast("ສູງສຸດ 6 ຄົນ", true); }
          touched = true; const lb = c.parentElement; lb.style.borderColor = c.checked ? "var(--pri)" : "var(--line)"; lb.style.background = c.checked ? "var(--pri2)" : "#fff"; preview();
        });
      };
      const drawQty = () => {
        const big = tVeh(e.veh)?.type === "big";
        if (!big) { e.rounds = [null, null, null, null]; e.places = ["", "", "", ""]; }
        // drivers can't change what ERP supplied: rounds on big trucks, sales counts on small ones
        const lock = (k) => (erpLock && (k === "rd" ? big : !big && T_ERP.includes(k)) ? "disabled" : "");
        const inp = (attr, l, v, k) => `<label>${esc(l)}<input ${attr} type="text" inputmode="numeric" value="${esc(v ?? "")}" ${lock(k)} style="text-align:right;font-variant-numeric:tabular-nums"></label>`;
        $("#tqf", r).innerHTML = (big ? [0, 1, 2, 3].map((i) => `<div class="grid" style="gap:4px">${inp(`data-rd="${i}"`, `ຮອບ ${i + 1} (ຕຸກ)`, e.rounds[i], "rd")}<input data-pl="${i}" maxlength="60" placeholder="ສົ່ງທີ່ໃສ ເຊັ່ນ ສາຂາ…" value="${esc(e.places[i])}" aria-label="ສະຖານທີ່ຮອບ ${i + 1}"></div>`) : [])
          .concat([["hh", "ຄົວເຮືອນ", "ຕຸກ 18L"], ["org", "ອົງກອນ", "ຕຸກ 18L"], ...T_FLAT.map(([k, l, d]) => [k, l, fmt(num(cfg.flat?.[k] ?? d)) + " ₭"])].map(([k, l, sub]) =>
            `<div class="qrow">${pIc(k)}<span class="ql">${esc(l)}<small>${esc(sub)}</small></span><span class="step"><button type="button" data-st="-1" ${lock(k)} aria-label="ລົບ ${esc(l)}">−</button><input data-q="${k}" type="text" inputmode="numeric" value="${esc(e[k] ?? "")}" ${lock(k)} aria-label="${esc(l)}"><button type="button" data-st="1" ${lock(k)} aria-label="ເພີ່ມ ${esc(l)}">+</button></span></div>`)).join("");
        $$("input", $("#tqf", r)).forEach((i) => i.addEventListener("input", preview));
        $$("[data-st]", $("#tqf", r)).forEach((b) => b.onclick = () => { const i = b.parentElement.querySelector("input"); i.value = Math.max(0, num(i.value) + +b.dataset.st) || ""; i.dispatchEvent(new Event("input")); });
      };
      $("#tv", r).addEventListener("change", () => { e.veh = val(r, "tv"); if (admin && !touched) e.crew = vehCrew(e.veh); else read(); drawCrew(); drawQty(); preview(); });
      ["ta", "tn"].forEach((id) => $("#" + id, r) && $("#" + id, r).addEventListener("input", preview));
      drawCrew(); drawQty(); preview();
      $("#tdel", r) && ($("#tdel", r).onclick = () => dialog({ title: "ລຶບລາຍງານ " + dmy(cur.date) + " · " + tVehName(cur.veh) + "?", danger: true, ok: "ລຶບ",
        onOk: async () => { await tapi("delete", { id: cur.id, base: cur.updatedAt }); toast("ລຶບແລ້ວ"); onDone && onDone(); } }));
      r._read = read;
    },
    onOk: async (r) => {
      r._read();
      try {
        const j = await tapi("save", { base: cur ? cur.updatedAt || "" : "", status: admin ? val(r, "ts") : undefined,
          entry: { date: e.date, veh: e.veh, crew: e.crew, hh: e.hh, org: e.org, glass: e.glass, m250: e.m250, pack: e.pack, packSelf: e.packSelf, packSelf2: e.packSelf2, rounds: e.rounds, places: e.places, adj: e.adj, note: e.note, damages: e.damages || [] } });
        toast(`ບັນທຶກແລ້ວ · ${fmt(j.entry.total)} ₭`); onDone && onDone(j.entry);
      } catch (x) {
        if (x.code === "conflict" && x.data?.current) { toast("ມີລາຍງານຂອງລົດນີ້ມື້ນີ້ແລ້ວ — ເປີດລາຍງານເດີມໃຫ້", true); setTimeout(() => tEntryForm(x.data.current, onDone), 30); return; }
        throw x;
      }
    } });
}

async function tabTrucks(m) {
  try { await tBoot(); } catch (e) { m.innerHTML = `<div class="err-box">${esc(e.message)}</div>`; return; }
  const p = tPeriod(S.month, T.cfg.periodStartDay);
  const [ej, dp, pj] = await Promise.all([tapi("entries", { from: p.start, to: p.end }), tapi("hr.driverPay", { month: S.month }), tapi("payroll.get", { period: p.start })]);
  const pr = pj.people || {}, wks = tWeeks(p);
  const wk = wks.find((w) => w[0] === S.cache.twk) || wks.find((w) => T.today >= w[0] && T.today <= w[1]) || wks[wks.length - 1];
  const list = ej.entries.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.veh < b.veh ? -1 : 1));
  const flt = S.cache.tf || "all", vf = S.cache.tveh || "";
  const noCrew = (e) => !(e.crew || []).filter(Boolean).length;
  const shown = list.filter((e) => (!vf || e.veh === vf) && (flt === "all" || (flt === "nocrew" ? noCrew(e) : flt === "approved" ? e.status === "approved" : e.status !== "approved")));
  const pend = list.filter((e) => e.status !== "approved"), pendOk = pend.filter((e) => !noCrew(e)), nc = list.filter(noCrew);
  const sum = (a) => a.reduce((s, e) => s + num(e.total), 0), unl = dp.rows.filter((r) => !r.empId && (r.approved || r.pending));
  const fb = (k, l, n) => `<button class="sm ${flt === k ? "pri" : ""}" data-tf="${k}">${esc(l)}${n != null ? ` (${n})` : ""}</button>`;
  const dm = (d) => d.slice(8) + "/" + d.slice(5, 7);
  const ws = Object.values(tShares(list, wk[0], wk[1])).sort((a, b) => tWeekly(b.nick) - tWeekly(a.nick) || b.ap + b.pe - a.ap - a.pe);
  const paidOf = (n) => pr[n]?.paidW?.[wk[0]];
  const due = (o) => (tWeekly(o.nick) ? o.ap - num(paidOf(o.nick)?.amt) : 0);
  const owed = ws.filter((o) => due(o) > 0);
  const wStatus = (o) => {
    const pd = paidOf(o.nick), d = due(o);
    if (!tWeekly(o.nick)) return pd ? `<span class="pill p-ok">ຈ່າຍແລ້ວ ${fmt(pd.amt)}</span>` : `<span class="pill">ຕັດຍອດທ້າຍເດືອນ</span>`;
    if (d > 0) return `<span class="pill p-warn">${pd ? "ຄ້າງເພີ່ມ" : "ຍັງບໍ່ຈ່າຍ"} ${fmt(d)}</span> <button class="sm pri" data-wpay="${esc(o.nick)}">ຈ່າຍແລ້ວ</button>`;
    if (pd) return `<span class="pill p-ok">ຈ່າຍແລ້ວ ${esc(dm(pd.at))}</span> <button class="sm" data-wun="${esc(o.nick)}">ຍົກເລີກ</button>`;
    return `<span class="pill">ລໍຖ້າອະນຸມັດ</span>`;
  };
  m.innerHTML = `<div class="grid" style="gap:14px">
    <div class="row"><div style="flex:1;min-width:220px"><h2>ລົດຂົນສົ່ງ</h2><div class="sm mut">ຮອບ ${esc(dmy(p.start))} – ${esc(dmy(p.end))} → ເຂົ້າເງິນເດືອນ ${esc(monthLabel(S.month))}</div></div>
      <button id="tnew" class="pri">+ ບັນທຶກການສົ່ງ</button><button id="tapv" ${pendOk.length ? "" : "disabled"}>ອະນຸມັດທີ່ລໍຖ້າ (${pendOk.length})</button><button id="tlnk">ຜູກຊື່ ↔ ພະນັກງານ</button><button id="tpay">ດຶງເຂົ້າເງິນເດືອນ</button></div>
    ${unl.length ? `<div class="warn-box">${unl.length} ຊື່ຍັງບໍ່ຜູກກັບພະນັກງານ HR: <b>${unl.map((r) => esc(r.nick)).join(", ")}</b> — ເງິນຂອງຄົນເຫຼົ່ານີ້ຈະບໍ່ເຂົ້າເງິນເດືອນ</div>` : ""}
    ${nc.length ? `<div class="warn-box">${nc.length} ລາຍງານຍັງບໍ່ມີທີມ (ສ່ວນຫຼາຍມາຈາກ ERP) — ເລືອກທີມກ່ອນອະນຸມັດ</div>` : ""}
    <div class="grid g4">
      <div class="card kpi"><span class="mut sm">ລາຍງານໃນຮອບ</span><span class="v">${list.length}</span></div>
      <div class="card kpi"><span class="mut sm">ຄ່າຄອມລວມ (₭)</span><span class="v">${fmt(sum(list))}</span></div>
      <div class="card kpi"><span class="mut sm">ອະນຸມັດແລ້ວ (₭)</span><span class="v" style="color:var(--ok)">${fmt(sum(list.filter((e) => e.status === "approved")))}</span></div>
      <div class="card kpi"><span class="mut sm">ລໍຖ້າ (₭) · ${pend.length} ລາຍງານ</span><span class="v" style="color:var(--warn)">${fmt(sum(pend))}</span></div>
    </div>
    <section class="card grid" style="gap:10px">
      <div class="row"><h3 style="flex:1;min-width:140px">ລາຍງານປະຈຳວັນ</h3><select id="tvf" style="width:auto" aria-label="ລົດ"><option value="">ທຸກລົດ</option>${T.cfg.vehicles.map((v) => `<option value="${esc(v.id)}" ${v.id === vf ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select>
        <div class="row" style="gap:4px">${fb("all", "ທັງໝົດ")}${fb("pending", "ລໍຖ້າ", pend.length)}${fb("approved", "ອະນຸມັດ")}${fb("nocrew", "ບໍ່ມີທີມ", nc.length)}</div></div>
      <div class="tw" style="max-height:60vh"><table><thead><tr><th>ວັນທີ</th><th>ລົດ</th><th>ທີມ</th><th>ຈຳນວນ</th><th class="num">ຄ່າຄອມ</th><th class="num">ຕໍ່ຄົນ</th><th>ສະຖານະ</th><th></th></tr></thead>
      <tbody>${shown.length ? shown.map((e) => `<tr><td class="num" style="text-align:left">${esc(dmy(e.date))}</td><td>${esc(tVehName(e.veh))}</td><td>${noCrew(e) ? `<span class="pill p-bad">ບໍ່ມີທີມ</span>` : esc(e.crew.join(", "))}</td><td class="sm">${esc(tQty(e))}${e.note ? `<div class="xs mut" style="max-width:260px;white-space:normal">${esc(e.note)}</div>` : ""}</td>
        <td class="num b">${fmt(e.total)}</td><td class="num">${noCrew(e) ? "—" : fmt(tShare(e))}</td><td style="white-space:nowrap">${pill(TST, e.status === "approved" ? "approved" : "pending")}${e.source === "erp" ? ` <span class="pill">ERP</span>` : ""}</td>
        <td style="white-space:nowrap"><button class="sm" data-te="${esc(e.id)}">ແກ້ໄຂ</button> <button class="sm" data-tt="${esc(e.id)}">${e.status === "approved" ? "ຖອນອະນຸມັດ" : "ອະນຸມັດ"}</button></td></tr>`).join("") : `<tr><td colspan="8" class="empty">ບໍ່ມີລາຍງານ</td></tr>`}</tbody></table></div></section>
    <section class="card grid" style="gap:10px">
      <div class="row"><h3 style="flex:1;min-width:140px">ຈ່າຍເງິນຍອດລາຍອາທິດ</h3>${owed.length ? `<button class="sm pri" id="wall">ຈ່າຍທີ່ຄ້າງທັງໝົດ (${owed.length} ຄົນ · ${fmt(owed.reduce((a, o) => a + due(o), 0))} ₭)</button>` : ""}</div>

// minimal .xlsx writer (zip "stored" + inline strings): no outside script, so the page's strict CSP stays as is
const CRC_T = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
const crc32 = (b) => { let c = -1; for (const x of b) c = CRC_T[(c ^ x) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; };
function zipStore(files) {
  const enc = new TextEncoder(), out = [], cen = []; let off = 0;
  for (const [name, text] of files) {
    const n = enc.encode(name), d = enc.encode(text), c = crc32(d);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);

  $("#lta").onclick = () => { $("#ltb").insertAdjacentHTML("beforeend", ltRow({ k: "", name: "", quota: 0, color: "#5B6B70", paid: true, active: true })); bindLt(); };
  const mapLink = () => { const la = $("#s_la").value, lo = $("#s_lo").value, a = $("#s_map");
    a.textContent = la && lo ? "ເບິ່ງໃນແຜນທີ່ ↗" : ""; a.href = la && lo ? `https://www.google.com/maps?q=${encodeURIComponent(la)},${encodeURIComponent(lo)}` : "#"; };
  ["s_la", "s_lo"].forEach((id) => $("#" + id).addEventListener("input", mapLink)); mapLink();
  $("#s_here").onclick = async () => { const b = $("#s_here"); b.disabled = true; const p = await getPos(); b.disabled = false;
    if (!p) return toast("ເອົາຕຳແໜ່ງບໍ່ໄດ້ — ອະນຸຍາດ GPS ໃນ browser ແລ້ວລອງໃໝ່", true);
    $("#s_la").value = p.lat.toFixed(6); $("#s_lo").value = p.lng.toFixed(6); mapLink(); toast(`ໄດ້ຕຳແໜ່ງແລ້ວ (ຄາດເຄື່ອນ ±${p.accuracy} ມ) — ກົດ ບັນທຶກການຕັ້ງຄ່າ`); };
  $("#ssv").onclick = async () => {
    try {
      const la = $("#s_la").value.trim(), lo = $("#s_lo").value.trim();
      if (!la !== !lo) throw new Error("ໃສ່ທັງ Latitude ແລະ Longitude ຫຼື ປ່ອຍວ່າງທັງສອງ");
      if (la && (Math.abs(+la) > 90 || Math.abs(+lo) > 180)) throw new Error("Latitude ຕ້ອງຢູ່ -90 ຫາ 90 (ລາວ ປະມານ 14–22) · Longitude ປະມານ 100–108 — ອາດໃສ່ສະລັບກັນ");
      const rates = {}; $$("[data-rate]").forEach((i) => rates[i.dataset.rate] = i.type === "checkbox" ? i.checked : num(i.value));
      const leaveTypes = $$("#ltb tr").map((tr) => ({ k: $("[data-lk]", tr).value.trim(), name: $("[data-ln]", tr).value.trim(), quota: num($("[data-lq]", tr).value), color: $("[data-lc]", tr).value, paid: $("[data-lp]", tr).checked, active: $("[data-la]", tr).checked }));
      const body = { rates, leaveTypes, shift: { start: $("#s_st").value, end: $("#s_en").value, grace: num($("#s_gr").value), workdays: $$("[data-wd]").filter((c) => c.checked).map((c) => +c.dataset.wd) },
        deposit: { refundMonths: num($("#s_dm").value), multiplier: num($("#s_dx").value) }, sickDocAfterDays: $("#s_sk").value === "" ? null : num($("#s_sk").value), gpsRetentionMonths: num($("#s_gp").value), site: la ? { lat: +la, lng: +lo, radius: num($("#s_ra").value) || 100 } : null,
        hideFields: { water_pack: $("#h_wp").checked, driver_pay: $("#h_dp").checked }, depts: $("#s_dp").value.split("\n"), positions: $("#s_ps").value.split("\n") };
      await api("settingsSave", { settings: body }); toast("ບັນທຶກແລ້ວ");
    } catch (e) { fail(e); }
  };
  $("#cpw").onclick = () => dialog({ title: "ປ່ຽນລະຫັດແອດມິນ", ok: "ປ່ຽນ", body: `<div class="grid" style="gap:10px"><label>ລະຫັດປັດຈຸບັນ<input type="password" id="c0"></label><label>ລະຫັດໃໝ່ (≥10)<input type="password" id="c1"></label><label>ຢືນຢັນ<input type="password" id="c2"></label></div>`,
    onOk: async (r) => { if (val(r, "c1") !== val(r, "c2")) throw new Error("ລະຫັດໃໝ່ບໍ່ກົງກັນ"); const x = await api("setPassword", { role: "admin", current: $("#c0", r).value, password: $("#c1", r).value }); S.token = x.token; SS.set("hr_tok", JSON.stringify({ t: x.token, r: "admin" })); toast("ປ່ຽນແລ້ວ — ເຄື່ອງອື່ນຈະຖືກອອກຈາກລະບົບ"); } });
  $("#spw").onclick = () => dialog({ title: "ລະຫັດ hr_staff", ok: "ບັນທຶກ", body: `<div class="grid" style="gap:10px"><label>ລະຫັດໃໝ່ (≥10)<input type="password" id="c1"></label><label>ຢືນຢັນ<input type="password" id="c2"></label><div class="mut xs">ແຈ້ງລະຫັດໃຫ້ຜູ້ໃຊ້ດ້ວຍຕົນເອງ</div></div>`,
    onOk: async (r) => { if (val(r, "c1") !== val(r, "c2")) throw new Error("ລະຫັດບໍ່ກົງກັນ"); await api("setPassword", { role: "staff", password: $("#c1", r).value }); toast("ບັນທຶກແລ້ວ"); renderTab(); } });
  $("#sdis") && ($("#sdis").onclick = () => dialog({ title: "ປິດ hr_staff?", danger: true, ok: "ປິດ", onOk: async () => { await api("setPassword", { role: "staff", disable: true }); renderTab(); } }));
  $("#bk").onclick = () => dialog({ title: "ສົ່ງອອກສຳຮອງ", ok: "ດາວໂຫຼດ", body: `<div class="warn-box">ໄຟລ໌ນີ້ບໍ່ໄດ້ເຂົ້າລະຫັດ ມີເງິນເດືອນ ແລະ ເລກບັນຊີທັງໝົດ. ຫ້າມສົ່ງທາງແຊັດ/ອີເມວ/GitHub.</div>`,
    onOk: async () => { const x = await api("backupExport"); const b = new Blob([JSON.stringify(x.backup)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `nany-hr-backup-${curDate()}.json`; a.click(); } });
  $("#al").onclick = async () => { try { const x = await api("auditLog", { limit: 300 }); $("#alv").innerHTML = `<div class="tw" style="max-height:420px"><table><thead><tr><th>ເວລາ</th><th>ຜູ້ເຮັດ</th><th>ການກະທຳ</th><th>ພະນັກງານ</th><th>ເດືອນ</th><th>ຊ່ອງ</th><th>ເກົ່າ → ໃໝ່</th></tr></thead><tbody>${x.rows.map((a) => `<tr><td class="num">${esc(fmtDT(a.at))}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.name || "")}</td><td>${esc(a.month || "")}</td><td>${esc(a.field || "")}</td><td class="xs">${a.field ? esc(a.old) + " → " + esc(a.new) : esc(a.detail ? JSON.stringify(a.detail) : "")}</td></tr>`).join("")}</tbody></table></div>`; } catch (e) { fail(e); } };
}
const ltRow = (t) => `<tr><td><input data-lk value="${esc(t.k)}" style="min-height:34px;width:110px"></td><td><input data-ln value="${esc(t.name)}" style="min-height:34px"></td><td><input data-lq type="number" step="0.5" value="${esc(t.quota)}" style="min-height:34px;width:80px"></td><td><input data-lc type="color" value="${esc(t.color)}" style="min-height:34px;width:56px;padding:2px"></td><td><input data-lp type="checkbox" ${t.paid !== false ? "checked" : ""} style="width:auto;min-height:0"></td><td><input data-la type="checkbox" ${t.active !== false ? "checked" : ""} style="width:auto;min-height:0"></td><td><button class="sm" data-ltdel>ລຶບ</button></td></tr>`;

/* ---------- boot ---------- */
(function boot() {
  const emp = LS.get("hr_emp_tok");
  let hr = null; try { hr = JSON.parse(SS.get("hr_tok") || "null"); } catch {}
  if (hr && hr.t) { S.role = hr.r; S.token = hr.t; startHR(); }
  else if (emp) { S.role = "emp"; S.token = emp; startEmp(); }
  else renderLogin();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.role === "emp" && S.me && S.me.today !== curDate()) startEmp(); });
})();
</script>
</body>
</html>
